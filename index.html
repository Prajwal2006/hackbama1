<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campus Furniture Bank - AR Demo</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; background: #f5f3ef; color: #222; }
      header { padding: 16px; background: #1f3a5f; color: #fff; }
      header h1 { margin: 0; font-size: 1.2rem; }
      main { padding: 16px; max-width: 640px; margin: 0 auto; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .card { background: #fff; border: 0; border-radius: 12px; padding: 8px; text-align: left; box-shadow: 0 1px 4px #0002; font: inherit; }
      .card .poster { width: 100%; height: 140px; object-fit: contain; display: block; }
      .card b { display: block; margin-top: 6px; }
      .card span { font-size: .8rem; color: #666; }
      #viewer { width: 100%; height: 55vh; background: #fff; border-radius: 12px; }
      .back { background: none; border: 0; font: inherit; color: #1f3a5f; padding: 8px 0; }
      .ar-btn { display: block; width: 100%; padding: 16px; margin: 12px 0; border: 0; border-radius: 12px; background: #1f3a5f; color: #fff; font-size: 1.1rem; }
      .hint, .msg { font-size: .9rem; color: #555; }
      .dims { background: #fff; border-radius: 12px; padding: 12px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header><h1>Campus Furniture Bank</h1></header>
    <main id="app"></main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
